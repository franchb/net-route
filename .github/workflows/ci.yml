name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt && rustup default 1.95.0
      - run: cargo fmt --all -- --check
      - run: cargo build --all-targets
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - name: cargo audit
        run: |
          command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked
          cargo audit

  macos:
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write # for actions/upload-artifact
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal --component clippy && rustup default 1.95.0
      - run: cargo build --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      # Live end-to-end: fetch+parse a real table must succeed.
      - run: cargo run --example dump_table
      # Capture the real raw NET_RT_DUMP table + ground truth for the mapscan fixture.
      - name: capture raw NET_RT_DUMP fixture
        run: |
          cat > /tmp/dump.c <<'EOF'
          #include <sys/types.h>
          #include <sys/socket.h>
          #include <sys/sysctl.h>
          #include <net/route.h>
          #include <stdlib.h>
          #include <unistd.h>
          int main(void){
            int mib[6]={CTL_NET,PF_ROUTE,0,0,NET_RT_DUMP,0};
            size_t n=0;
            if(sysctl(mib,6,0,&n,0,0)<0) return 1;
            char*b=malloc(n);
            if(!b||sysctl(mib,6,b,&n,0,0)<0) return 2;
            return (int)(write(1,b,n)!=(ssize_t)n);
          }
          EOF
          cc -o /tmp/dump /tmp/dump.c && /tmp/dump > macos-rt-dump.bin
          netstat -rn > macos-rt-dump.expected.txt
          ls -l macos-rt-dump.bin macos-rt-dump.expected.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-rt-fixture
          path: |
            macos-rt-dump.bin
            macos-rt-dump.expected.txt

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal --component clippy && rustup default 1.95.0
      - run: cargo build --all-targets
      - run: cargo clippy --all-targets -- -D warnings

  # The pure parser must never panic on any input. cargo-fuzz needs nightly
  # (libFuzzer), so this runs on its own toolchain rather than the pinned
  # stable used by the build jobs. A bounded smoke run keeps CI fast while
  # still exercising the panic-freedom invariant on every push.
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal && rustup default nightly
      - name: install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null 2>&1 || cargo install cargo-fuzz --locked
      - name: smoke-run parse_route_messages (bounded)
        run: cargo fuzz run parse_route_messages -- -max_total_time=30 -max_len=65536
